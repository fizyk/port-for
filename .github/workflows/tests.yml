name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@a8292e61e765f89badf5420420611c3092922421 # v5.11.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  tests-macos:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@a8292e61e765f89badf5420420611c3092922421 # v5.11.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
      os: macos-latest
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  tests-windows:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@a8292e61e765f89badf5420420611c3092922421 # v5.11.1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
      os: windows-latest
      env: '{"PYTHONTRACEMALLOC": 20}'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
