name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@723826f1995ca7fd088e1ca408592f275fd7aeee # v5.11.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  tests-macos:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@723826f1995ca7fd088e1ca408592f275fd7aeee # v5.11.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
      os: macos-latest
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  tests-windows:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@723826f1995ca7fd088e1ca408592f275fd7aeee # v5.11.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]'
      dependency-manager: uv
      os: windows-latest
      env: '{"PYTHONTRACEMALLOC": 20}'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
